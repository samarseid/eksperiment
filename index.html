<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agrokimyoda Eksperimentni Rejalashtirish Nazariyasi — Axmadaliyeva Mubina</title>
  
  <!-- Tailwind CSS v4 Browser Build -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4"></script>
  
  <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --paper-bg: #F5F1E9;
      --paper-card: #FCFAF6;
      --paper-warm: #EFE8DC;
      --ink-primary: #191816;
      --ink-secondary: #423E37;
      --ink-muted: #736D62;
      --terracotta: #BE4D28;
      --terracotta-dark: #8F3416;
      --terracotta-light: #F4E7E0;
      --sage: #3E5340;
      --sage-light: #E9F0EA;
      --ochre: #C58B3E;
      --border-line: #DFD7C7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--paper-bg);
      color: var(--ink-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .font-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .paper-texture {
      background-image: radial-gradient(rgba(25, 24, 22, 0.04) 1px, transparent 0);
      background-size: 20px 20px;
    }

    /* FIXED VIRTUAL STAGE: Guarantees exact landscape layout on phones, tablets, laptops */
    #stage-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 8px;
    }

    #slide-stage {
      width: 1120px;
      height: 630px;
      min-width: 1120px;
      min-height: 630px;
      max-width: 1120px;
      max-height: 630px;
      background-color: var(--paper-card);
      border: 1px solid var(--border-line);
      box-shadow: 0 16px 36px -8px rgba(30, 26, 20, 0.14), 0 4px 12px -2px rgba(30, 26, 20, 0.06);
      border-radius: 2px;
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: absolute;
      transform-origin: center center;
      transition: opacity 0.2s ease, transform 0.15s ease-out;
    }

    /* Broken Grid Aesthetics */
    .stamp-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid currentColor;
      font-weight: 600;
    }
    
    .tilted-left {
      transform: rotate(-1.2deg);
    }
    
    .tilted-right {
      transform: rotate(1.4deg);
    }

    .editorial-quote {
      position: relative;
      border-left: 3px solid var(--terracotta);
      padding-left: 1.25rem;
    }

    /* Print / PDF view: Clean sequential landscape pages */
    @media print {
      body {
        background: #FAF8F5 !important;
        overflow: visible !important;
        height: auto !important;
        display: block !important;
      }
      .no-print {
        display: none !important;
      }
      #stage-wrapper {
        display: block !important;
        overflow: visible !important;
        height: auto !important;
        padding: 0 !important;
      }
      #slide-stage {
        position: static !important;
        transform: none !important;
        page-break-after: always !important;
        break-after: page !important;
        margin: 0 auto 30px auto !important;
        box-shadow: none !important;
        border: 1px solid #C8C0B0 !important;
      }
    }
  </style>
</head>
<body class="paper-texture">

  <!-- Top Editorial Header Bar -->
  <header class="no-print w-full border-b border-[#DFD7C7] bg-[#F5F1E9]/95 backdrop-blur-md px-4 sm:px-6 py-2.5 flex items-center justify-between text-xs tracking-wider z-40 shrink-0">
    <div class="flex items-center gap-2.5">
      <span class="w-2.5 h-2.5 bg-[#BE4D28] rounded-full inline-block"></span>

      <span class="text-[#A39B8E] hidden sm:inline">|</span>

    <div class="flex items-center gap-3">
      <span class="font-mono text-[#736D62] hidden lg:inline text-[11px]">Tadqiqotchi: <strong class="text-[#191816]">Axmadaliyeva Mubina</strong></span>

      <div id="mobile-hint" class="flex sm:hidden items-center gap-1 text-[10px] font-mono text-[#BE4D28] bg-[#F4E7E0] px-2 py-0.5 rounded border border-[#BE4D28]/40">

        <span class="hidden sm:inline">Mundarija (O)</span>
      </button>
      
      <button onclick="window.print()" class="cursor-pointer border border-[#C2BAAA] hover:border-[#191816] px-2 py-1 rounded text-[11px] font-mono flex items-center gap-1 transition-colors" title="PDF ga saqlash / Chop etish (P)">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>

      <button onclick="toggleFullScreen()" class="cursor-pointer text-[#423E37] hover:text-[#BE4D28] p-1" title="To'liq ekran (F)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
      </button>
    </div>
  </header>

  <!-- Interactive Slide Viewport: Fits exact screen keeping horizontal 16:9 -->
  <main id="stage-wrapper">
    <div id="slide-stage">
      <div id="slide-content" class="h-full flex flex-col justify-between relative z-10">
        <!-- Injected via JavaScript -->
      </div>
      
      <!-- Subtle Stage Stamp -->
      <div class="absolute bottom-2.5 right-6 pointer-events-none opacity-25 font-mono text-[9px] tracking-widest text-[#736D62] flex items-center gap-2">
        <span>AGROKIMYO ILMIY METODOLOGIYASI</span>
        <span>•</span>
        <span>DOE-2026</span>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <footer class="no-print w-full border-t border-[#DFD7C7] bg-[#F5F1E9] px-4 sm:px-6 py-2.5 flex items-center justify-between gap-3 z-40 shrink-0">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5">
        <button id="btn-prev" onclick="prevSlide()" class="cursor-pointer w-8 h-8 rounded border border-[#C2BAAA] hover:border-[#BE4D28] hover:text-[#BE4D28] flex items-center justify-center transition-all bg-white shadow-2xs">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button id="btn-next" onclick="nextSlide()" class="cursor-pointer w-8 h-8 rounded border border-[#C2BAAA] hover:border-[#BE4D28] hover:bg-[#BE4D28] hover:text-white flex items-center justify-center transition-all bg-[#191816] text-white shadow-2xs">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <div class="font-mono text-xs tracking-wider">
        <span id="current-slide-num" class="font-bold text-[#BE4D28] text-sm">01</span>
        <span class="text-[#A39B8E]">/</span>
        <span id="total-slides-num" class="text-[#736D62]">14</span>
      </div>
    </div>

    <!-- Active Slide Title in Footer -->
    <div class="hidden md:flex items-center gap-2 text-xs font-mono text-[#423E37]">
      <span class="w-1.5 h-1.5 bg-[#BE4D28]"></span>
      <span id="footer-slide-title" class="font-semibold truncate max-w-lg">Titul</span>
    </div>

    <!-- Timeline Progress Dots -->
    <div id="progress-dots" class="flex items-center gap-1 overflow-x-auto py-1">
      <!-- Generated via JS -->
    </div>
  </footer>

  <div id="overview-modal" class="fixed inset-0 bg-[#191816]/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#FCFAF6] border border-[#C2BAAA] w-full max-w-4xl max-h-[85vh] rounded p-6 flex flex-col shadow-2xl">
      <div class="flex items-center justify-between border-b border-[#DFD7C7] pb-3 mb-4">
        <div>
          <h3 class="font-serif text-2xl font-bold text-[#191816]">Prezentatsiya Mundarijasi</h3>
          <p class="text-xs text-[#736D62] font-mono mt-0.5">Istalgan slaydga o'tish uchun ustiga bosing</p>
        </div>
        <button onclick="toggleOverview()" class="cursor-pointer text-[#736D62] hover:text-[#BE4D28] p-1 text-2xl font-bold">&times;</button>
      </div>
      <div id="overview-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 overflow-y-auto pr-2 flex-1">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

      /* SLIDE 14: XULOSA */

        id: 14,
        category: "XULOSA VA TAVSIYALAR",
        title: "Xulosa va Magistrlik Tadqiqotiga Tavsiyalar",
        subtitle: "Agrokimyoda DoE ning strategik roli, ekologik-iqtisodiy xulosalar va kelajakdagi istiqbollar",
        render: () => `

              <div>
                <span class="text-[10px] font-mono uppercase tracking-widest text-[#BE4D28] font-bold">13 // CONCLUSIVE REMARKS & RECOMMENDATIONS</span>
                <h2 class="font-serif text-2xl font-bold text-[#191816]">Ilmiy Xulosalar va Amaliy Takliflar</h2>

              <span class="font-mono text-[11px] text-[#736D62]">MAGISTRAL TADQIQOT</span>
            </div>

            <div class="grid grid-cols-12 gap-4 my-auto py-2">
              <div class="col-span-4 bg-[#FAF7F2] border border-[#DFD7C7] p-3.5 flex flex-col justify-between">
                <div>
                  <div class="font-mono text-xl font-bold text-[#BE4D28] mb-1">01</div>
                  <h3 class="font-serif text-base font-bold text-[#191816] mb-1">Metodologik Ilg'orlik</h3>

              <div class="col-span-4 bg-[#FAF7F2] border border-[#DFD7C7] p-3.5 flex flex-col justify-between">

                  Aniq dehqonchilik asosi.
                </div>
              </div>

              <div class="col-span-4 bg-[#FCFAF6] border-2 border-[#BE4D28] p-3.5 flex flex-col justify-between shadow-2xs">
                <div>
                  <div class="font-mono text-xl font-bold text-[#BE4D28] mb-1">03</div>
                  <h3 class="font-serif text-base font-bold text-[#191816] mb-1">Magistrlik Dissertatsiyasiga</h3>
                  <p class="text-xs text-[#423E37] leading-relaxed">
                    Magistrant dissertatsiyasida kamida 2<sup>3</sup> yoki Boks-Benken rejasi asosida tajriba o'tkazish, ANOVA va ko'p parametrli regressiya tuzish tavsiya etiladi.

                  Ilmiy yangilik kafolati.

              <div>
                <span class="text-[#736D62]">Taqdimot tayyorlovchi:</span>

                E'tiboringiz uchun tashakkur!
              </div>
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 1;
    const totalSlides = slidesData.length;

    function renderSlide(index) {
      if (index < 1) index = 1;
      if (index > totalSlides) index = totalSlides;
      currentSlide = index;

      const slide = slidesData[currentSlide - 1];
      const container = document.getElementById('slide-content');
      
      document.getElementById('current-slide-num').innerText = String(currentSlide).padStart(2, '0');
      document.getElementById('total-slides-num').innerText = String(totalSlides).padStart(2, '0');
      document.getElementById('footer-slide-title').innerText = `${slide.category}: ${slide.title}`;

      container.style.opacity = '0';
      setTimeout(() => {
        container.innerHTML = slide.render();
        container.style.opacity = '1';
      }, 60);

      document.getElementById('btn-prev').disabled = currentSlide === 1;
      document.getElementById('btn-prev').classList.toggle('opacity-30', currentSlide === 1);
      document.getElementById('btn-next').disabled = currentSlide === totalSlides;
      document.getElementById('btn-next').classList.toggle('opacity-30', currentSlide === totalSlides);

      updateProgressDots();
    }

    function updateProgressDots() {
      const container = document.getElementById('progress-dots');
      container.innerHTML = '';
      for (let i = 1; i <= totalSlides; i++) {
        const dot = document.createElement('button');
        dot.className = `cursor-pointer h-2 transition-all rounded-xs ${
          i === currentSlide 
            ? 'w-6 bg-[#BE4D28]' 
            : 'w-2 bg-[#DFD7C7] hover:bg-[#736D62]'
        }`;
        dot.title = `Slayd ${i}: ${slidesData[i-1].title}`;
        dot.onclick = () => renderSlide(i);
        container.appendChild(dot);
      }
    }

    function prevSlide() {
      if (currentSlide > 1) renderSlide(currentSlide - 1);
    }

    function nextSlide() {
      if (currentSlide < totalSlides) renderSlide(currentSlide + 1);
    }

    function toggleOverview() {
      const modal = document.getElementById('overview-modal');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        populateOverviewGrid();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function populateOverviewGrid() {
      const grid = document.getElementById('overview-grid');
      grid.innerHTML = '';
      slidesData.forEach((s) => {
        const card = document.createElement('div');
        const isActive = s.id === currentSlide;
        card.className = `cursor-pointer p-2.5 border rounded-xs transition-all text-left flex flex-col justify-between h-28 ${
          isActive 
            ? 'border-[#BE4D28] bg-[#F4E7E0] shadow-xs' 
            : 'border-[#DFD7C7] bg-white hover:border-[#736D62]'
        }`;
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center text-[9px] font-mono text-[#736D62] mb-0.5">
              <span class="font-bold ${isActive ? 'text-[#BE4D28]' : ''}">${String(s.id).padStart(2, '0')}</span>
              <span class="truncate max-w-[80px]">${s.category}</span>
            </div>
            <h4 class="font-serif font-bold text-xs text-[#191816] line-clamp-2 leading-tight">${s.title}</h4>
          </div>
          <div class="text-[9px] font-mono text-[#A39B8E] truncate">${s.subtitle}</div>
        `;
        card.onclick = () => {
          renderSlide(s.id);
          toggleOverview();
        };
        grid.appendChild(card);
      });
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /* DYNAMIC HORIZONTAL SCALER: Locks 1120x630 landscape stage on any device */
    function updateSlideScale() {
      const stage = document.getElementById('slide-stage');
      const wrapper = document.getElementById('stage-wrapper');
      if (!stage || !wrapper) return;

      const targetWidth = 1120;
      const targetHeight = 630;

      const availW = wrapper.clientWidth - 16;
      const availH = wrapper.clientHeight - 16;

      const scale = Math.min(availW / targetWidth, availH / targetHeight);
      stage.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', updateSlideScale);
    window.addEventListener('orientationchange', () => {
      setTimeout(updateSlideScale, 150);
    });

    // Touch Swipe Gestures for Mobile
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) {
        nextSlide();
      } else if (touchEndX - touchStartX > 50) {
        prevSlide();
      }
    }, { passive: true });

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'Home') {
        renderSlide(1);
      } else if (e.key === 'End') {
        renderSlide(totalSlides);
      } else if (e.key.toLowerCase() === 'o') {
        toggleOverview();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
      } else if (e.key.toLowerCase() === 'p') {
        window.print();
      } else if (e.key === 'Escape') {
        document.getElementById('overview-modal').classList.add('hidden');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderSlide(1);
      updateSlideScale();
    });
  </script>
